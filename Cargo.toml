[package]
name = "xgb"
version = "3.2.0"
authors = ["Dave Challis <dave@suicas.net>", "Marco Mengelkoch", "Felix Agene <agene001@umn.edu>"]
license = "MIT"
repository = "https://github.com/agene0001/rust-xgboost"
homepage = "https://github.com/agene0001/rust-xgboost"
description = "Machine learning using XGBoost"
documentation = "https://github.com/agene0001/rust-xgboost"
readme = "README.md"
edition = "2024"

[dependencies]
xgboost-sys = { package = "xgboost_lib-sys", path = "xgboost-sys", version = "3.2.0" }
libc = "0.2.186"
derive_builder = "0.20.2"
log = "0.4.32"
tempfile = "3.27.0"
indexmap = "2.14.0"

[features]
use_prebuilt_xgb = ["xgboost-sys/use_prebuilt_xgb"]
local_build = ["xgboost-sys/local_build"]
cuda = ["xgboost-sys/cuda"]
# Build libxgboost from the pinned submodule by default so the headers used for
# bindgen and the runtime library can never disagree. Use
# `--no-default-features --features use_prebuilt_xgb` for the download path.
default = ["local_build"]

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "dmatrix_benchmark"
harness = false

[[bench]]
name = "predict_benchmark"
harness = false

[[example]]
name = "bench_table"
