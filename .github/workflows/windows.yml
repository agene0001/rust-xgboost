name: Windows

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # Ninja is deliberately not installed: build.rs picks it up from PATH if
    # present, and the generator proven on Windows is the Visual Studio one that
    # release-libs.yml uses.
    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose
      
