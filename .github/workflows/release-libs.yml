name: Release XGBoost binaries

# Builds libxgboost from the pinned submodule on every supported target and
# publishes the libraries as GitHub release assets. xgboost-sys's
# `use_prebuilt_xgb` feature downloads these (see PREBUILT_RELEASE_URL in
# xgboost-sys/build.rs — keep its tag in sync with the tag released here).
#
# Trigger by pushing a `v*` tag, or manually via workflow_dispatch with the
# tag to create/update.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v3.2.0)"
        required: true
        default: "v3.2.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac_arm64
          - os: ubuntu-latest
            target: linux_amd64
          - os: ubuntu-22.04-arm
            target: linux_arm64
          - os: windows-latest
            target: win_amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp ninja

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -S xgboost-sys/xgboost -B build -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S xgboost-sys/xgboost -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      # Flat asset names (<target>-<file>) because GitHub release assets have
      # no directory structure. xgboost's CMake links the main library into
      # <source-dir>/lib (not the build dir); libdmlc.a stays under build/,
      # so both roots are searched.
      - name: Collect libraries
        run: |
          mkdir -p dist
          collect() {
            src="$(find build xgboost-sys/xgboost/lib -name "$1" 2>/dev/null | head -1)"
            if [ -z "$src" ]; then
              echo "ERROR: $1 not found under build/ or xgboost-sys/xgboost/lib/"
              exit 1
            fi
            echo "collecting $src"
            cp "$src" "dist/${{ matrix.target }}-$1"
          }
          case "${{ matrix.target }}" in
            mac_arm64)
              collect libxgboost.dylib
              collect libdmlc.a
              ;;
            linux_*)
              collect libxgboost.so
              collect libdmlc.a
              ;;
            win_amd64)
              collect xgboost.dll
              collect xgboost.lib
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/*
